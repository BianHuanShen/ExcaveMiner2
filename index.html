<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ El Minero del Abismo</title>
<link rel="stylesheet" href="css/01-core.css">
  <link rel="stylesheet" href="css/02-layout.css">
  <link rel="stylesheet" href="css/03-controls.css">
  <link rel="stylesheet" href="css/04-panels.css">
  <link rel="stylesheet" href="css/05-inventory.css">
  <link rel="stylesheet" href="css/06-modals.css">
  <link rel="stylesheet" href="css/07-animations.css">
  <link rel="stylesheet" href="css/08-responsive.css">
</head>
<body>

<div id="game">

  <!-- ======= PANTALLA DE INICIO ======= -->
  <div id="start-screen" class="screen">
    <h1>⛏️ EL MINERO DEL ABISMO</h1>
    <p class="subtitle">Excava. Descubre. Sobrevive.</p>
    <div class="difficulty-select">
      <p>Elige tu dificultad:</p>
      <button class="diff-btn" data-diff="facil">😌 Fácil</button>
      <button class="diff-btn" data-diff="normal">⚔️ Normal</button>
      <button class="diff-btn" data-diff="dificil">💀 Difícil</button>
    </div>
    <button id="continue-btn" class="big-btn" style="display:none;">▶ Continuar partida guardada</button>
  </div>

  <!-- ======= HUD ======= -->
  <div id="hud" class="hidden">
    <div class="hud-row">
      <div class="stat">
        <span class="label">❤️ Vida</span>
        <div class="bar"><div id="hp-fill" class="fill hp"></div></div>
        <span id="hp-text" class="value"></span>
      </div>
      <div class="stat">
        <span class="label">⚡ Energía</span>
        <div class="bar"><div id="energy-fill" class="fill energy"></div></div>
        <span id="energy-text" class="value"></span>
      </div>
    </div>
    <div class="hud-row">
      <div class="stat">
        <span class="label">⭐ Nivel <span id="level-text"></span></span>
        <div class="bar"><div id="xp-fill" class="fill xp"></div></div>
        <span id="xp-text" class="value"></span>
      </div>
      <div class="stat-simple">💰 <span id="gold-text">0</span></div>
    </div>
    <div class="hud-row small">
      <span id="pickaxe-text"></span>
      <span id="pos-text"></span>
      <span id="diff-text"></span>
    </div>
  </div>

  <!-- ======= MAPA ======= -->
  <div id="map-container" class="hidden">
    <div id="map-grid"></div>
  </div>

  <!-- ======= LOG DE MENSAJES ======= -->
  <div id="log" class="hidden"></div>

  <!-- ======= CONTROLES DE EXCAVACIÓN ======= -->
  <div id="controls" class="hidden">
    <div class="dpad">
      <button id="dig-up" class="dig-btn">⛏️ ↑</button>
      <div class="dpad-mid">
        <button id="dig-left" class="dig-btn">⛏️ ←</button>
        <button id="go-home" class="dig-btn home">🏠</button>
        <button id="dig-right" class="dig-btn">⛏️ →</button>
      </div>
      <button id="dig-down" class="dig-btn">⛏️ ↓</button>
    </div>
  </div>

  <!-- ======= PANEL INFERIOR (pestañas) ======= -->
  <div id="bottom-tabs" class="hidden">
    <button class="tab-btn" data-tab="inventory">🎒 Mochila</button>
    <button class="tab-btn" data-tab="shelter">🏠 Refugio</button>
    <button class="tab-btn" data-tab="shop">🪙 Tienda</button>
  </div>

  <div id="panel-inventory" class="panel hidden">
    <h3>🎒 Mochila <span id="bag-capacity"></span></h3>
    <div id="inventory-list"></div>
  </div>

  <div id="panel-shelter" class="panel hidden">
    <h3>🛏️ Refugio del Minero</h3>
    <p>Aquí puedes recuperar fuerzas antes de volver al Abismo.</p>
    <button id="sleep-btn" class="action-btn">😴 Dormir (recupera vida y energía)</button>
  </div>

  <div id="panel-shop" class="panel hidden">
    <h3>🪙 Mercader</h3>
    <div class="shop-section">
      <h4>Vender tesoros</h4>
      <div id="sell-list"></div>
    </div>
    <div class="shop-section">
      <h4>Mejorar pico</h4>
      <div id="pickaxe-shop"></div>
    </div>
    <div class="shop-section">
      <h4>Mochila y pociones</h4>
      <div id="other-shop"></div>
    </div>
  </div>

  <!-- ======= POPUP DE TESORO ======= -->
  <div id="treasure-popup" class="treasure-popup hidden">
    <div class="treasure-card">
      <div id="treasure-rarity" class="treasure-rarity"></div>
      <div id="treasure-icon" class="treasure-icon">💎</div>
      <h2 id="treasure-name">Tesoro encontrado</h2>
      <p id="treasure-description"></p>
      <div id="treasure-reward" class="treasure-reward"></div>
      <button id="treasure-close" class="action-btn">Continuar excavando</button>
    </div>
  </div>

  <button id="reset-btn" class="hidden">🗑️ Reiniciar partida</button>

</div>
